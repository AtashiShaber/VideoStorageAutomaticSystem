spring:
  datasource:
    url: jdbc:h2:file:./data/videostorage;AUTO_SERVER=TRUE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.atashi.vide.storage.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.mybatis: DEBUG
    com.atashi.vide.storage: DEBUG
